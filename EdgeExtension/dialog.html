<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Карточка — Context VK.RU</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      background: #f4f6f8;
      color: #1f2733;
    }
    .dlg { max-width: 440px; margin: 0 auto; padding: 18px 20px 20px; }
    .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .head h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .head .cid {
      font: 11px/1 ui-monospace, Consolas, monospace;
      color: #2b6fb3; background: #e6f0fa; border: 1px solid #bcd8ef;
      border-radius: 4px; padding: 3px 7px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #6b7686; margin-bottom: 4px; }
    .field input[type="text"], .field textarea, .field select {
      width: 100%; padding: 7px 9px; font: inherit; color: inherit;
      background: #fff; border: 1px solid #ccd4de; border-radius: 5px; outline: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #2b6fb3; box-shadow: 0 0 0 2px rgba(43,111,179,.15); }
    .field textarea { resize: vertical; min-height: 56px; }
    .pal { display: flex; gap: 8px; }
    .swatch {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; padding: 0; transition: transform .12s ease, border-color .12s ease;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.sel { border-color: #1f2733; box-shadow: 0 0 0 2px #fff inset; }
    .ids { margin: 0; padding: 0; list-style: none; }
    .ids li {
      font: 11px/1.6 ui-monospace, Consolas, monospace; color: #4a5568;
      background: #fff; border: 1px solid #dde3ea; border-radius: 4px;
      padding: 5px 8px; margin-bottom: 5px; word-break: break-all;
    }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    button.act {
      flex: 1; padding: 9px 0; font: 600 13px "Segoe UI", sans-serif; border-radius: 5px;
      border: 1px solid transparent; cursor: pointer; transition: background .12s ease;
    }
    #btn-save { background: #2b6fb3; color: #fff; }
    #btn-save:hover { background: #245d96; }
    #btn-close { background: #fff; color: #4a5568; border-color: #ccd4de; }
    #btn-close:hover { background: #eef1f5; }
    #btn-delete { background: #fff; color: #a63d40; border-color: #dcb3b5; }
    #btn-delete:hover { background: #fbeef0; }
    button.act:disabled { opacity: .45; cursor: not-allowed; }
    .empty { color: #8a94a3; font-style: italic; }
  </style>
</head>
<body>
  <div class="dlg">
    <div class="head">
      <h1>Карточка</h1>
      <span class="cid" id="card-id">…</span>
    </div>

    <div class="field">
      <label for="f-name">Имя (displayName)</label>
      <input id="f-name" type="text" placeholder="имя, выбранное пользователем" />
    </div>

    <div class="field">
      <label for="f-note">Примечание</label>
      <textarea id="f-note" placeholder="заметка по человеку / сообществу"></textarea>
    </div>

    <div class="field">
      <label for="f-status">Статус</label>
      <select id="f-status">
        <option value="saved">saved</option>
        <option value="dirt">dirt</option>
        <option value="partner">partner</option>
        <option value="vip">vip</option>
      </select>
    </div>

    <!-- v07f5 (R16): граница персона/сообщество — явная разделительная линия -->
    <hr style="border:none;border-top:1px solid #ccd4de;margin:14px 0" />
    <div class="field">
      <label for="f-type">Тип</label>
      <select id="f-type">
        <option value="PERSON">персона</option>
        <option value="COMMUNITY">сообщество</option>
      </select>
    </div>

    <div class="field">
      <label>Цвет карточки</label>
      <div class="pal" id="f-palette"></div>
    </div>

    <div class="field">
      <label>Удостоверения (только чтение)</label>
      <ul class="ids" id="f-identities"></ul>
    </div>

    <div class="field">
      <label>Точка встречи и история (чтение, последние 5)</label>
      <ul class="ids" id="f-meet"></ul>
      <label style="margin-top:8px" for="f-answer">Ответ последнего контакта</label>
      <select id="f-answer">
        <option value="ожидание">ожидание</option>
        <option value="да">да</option>
        <option value="нет">нет</option>
      </select>
    </div>

    <div class="row">
      <button class="act" id="btn-save" type="button">Сохранить</button>
      <button class="act" id="btn-close" type="button">Закрыть</button>
      <button class="act" id="btn-delete" type="button">Удалить карточку</button>
    </div>
  </div>

  <script src="src/core/messaging.js"></script>
  <script src="src/core/storage.js"></script>
  <script src="src/ui/dialog.js"></script>
</body>
</html>
